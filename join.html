<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Server</title>
<style>
  body { margin:0; min-height:100vh; padding:20px; box-sizing:border-box;
         display:grid; grid-template-columns:minmax(0,300px) minmax(0,440px) minmax(0,300px);
         justify-content:space-between; align-items:center; gap:20px;
         background-color:#1e1f22;
         background-image:url("https://github.com/WORSTAsaiya/ASAIYASITE/blob/main/WORST.png?raw=true");
         background-size:cover; background-position:center; background-repeat:no-repeat;
         color:#f2f3f5; font-family:system-ui,Segoe UI,Arial,sans-serif; }
  .card { background:#2b2d31; padding:28px 32px; border-radius:12px; text-align:center; }
  h1 { margin:0 0 8px; font-size:22px; }
  p { margin:6px 0 18px; color:#b5bac1; font-size:14px; }
  .btn { display:inline-block; background:#3498db; color:#fff; text-decoration:none; font-weight:700;
         padding:12px 22px; border-radius:8px; }
  code { display:block; margin-top:18px; padding:10px; background:#1e1f22; border-radius:8px;
         font-size:12px; word-break:break-all; color:#b5bac1; }

  .panel { background:rgba(30,31,34,.88); border-radius:12px; padding:16px; align-self:start; margin-top:8px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  #feed { display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto; }
  .item { display:block; padding:10px 12px; background:#2b2d31; border-radius:8px; color:inherit;
          text-decoration:none; border-left:3px solid #3498db; }
  .item:hover { background:#34363c; }
  .item.new { animation:flash 1.6s ease-out; }
  .item b { display:block; font-size:14px; }
  .item span { display:block; font-size:12px; color:#b5bac1; margin-top:2px; }
  .empty { font-size:13px; color:#b5bac1; }
  .Secret { border-color:#E74C3C; } .Eternal { border-color:#9B59B6; } .Divine { border-color:#F1C40F; }
  #joined { font-size:14px; }
  .item { display:grid; grid-template-columns:56px minmax(0,1fr); gap:10px; align-items:center; }
  .item span { word-break:break-word; }
  .item .time { opacity:.7; }
  .pic { width:56px; height:56px; border-radius:8px; background:#1e1f22; overflow:hidden; }
  .pic img { width:100%; height:100%; object-fit:contain; display:block; }
  .info { min-width:0; }
  dialog { background:#2b2d31; color:#f2f3f5; border:0; border-radius:12px; padding:24px; max-width:340px; width:88%;
           font-family:system-ui,Segoe UI,Arial,sans-serif; text-align:center; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  dialog h3 { margin:0 0 6px; font-size:18px; }
  dialog p { margin:0 0 18px; font-size:14px; }
  .dlgbtns { display:flex; gap:10px; }
  .dlgbtns button { flex:1; padding:11px; border:0; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; color:#fff; }
  .dlgbtns .yes { background:#3498db; } .dlgbtns .no { background:#4e5058; }
  .never { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; font-size:12px; color:#b5bac1; cursor:pointer; }
  @keyframes flash { from { background:#3d5a80; } to { background:#2b2d31; } }
  @media (max-width:980px) {
    body { grid-template-columns:minmax(0,1fr); justify-content:center; }
    .card { order:1; } #left { order:2; } #right { order:3; }
    #feed { max-height:40vh; }
  }
</style>
</head>
<body>

<aside class="panel" id="left">
  <h2>New Webhooks</h2>
  <div id="feed"><div class="empty">Waiting for the first alert...</div></div>
</aside>

<div class="card">
  <h1 id="title">Joining server...</h1>
  <p id="msg">Your browser may ask to open Roblox. Click Open / Allow.</p>
  <a id="btn" class="btn" href="#">Open Roblox</a>
  <code id="raw"></code>
</div>

<aside class="panel" id="right">
  <div id="joined">User 1 Joined - Server 1</div>
</aside>

<dialog id="dlg">
  <h3>Do you want to join this server?</h3>
  <p id="dlgEgg"></p>
  <div class="dlgbtns"><button id="dlgNo" class="no" type="button">Cancel</button><button id="dlgYes" class="yes" type="button">Join</button></div>
  <label class="never"><input type="checkbox" id="never"> Never remind again</label>
</dialog>

<script>
  // Paste your Cloudflare Worker feed address here, for example https://eggfeed.yourname.workers.dev/feed
  var FEED_URL = "https://eggfeed.asaiyamain.workers.dev/feed";

  // ---------- join logic (unchanged) ----------
  var q = new URLSearchParams(location.search);
  var placeId = q.get("placeId") || "";
  var jobId = q.get("jobId") || "";
  var valid = /^\d{1,20}$/.test(placeId) && /^[0-9a-fA-F-]{36}$/.test(jobId);

  if (!placeId && !jobId) {
    document.getElementById("title").textContent = "No server selected";
    document.getElementById("msg").textContent = "Pick one from New Webhooks.";
    document.getElementById("btn").style.display = "none";
  } else if (!valid) {
    document.getElementById("title").textContent = "Invalid link";
    document.getElementById("msg").textContent = "The place ID or server ID is missing or malformed.";
    document.getElementById("btn").style.display = "none";
  } else {
    var url = "roblox://experiences/start?placeId=" + placeId + "&gameInstanceId=" + jobId;
    document.getElementById("btn").href = url;
    document.getElementById("raw").textContent = url;
    setTimeout(function () { location.href = url; }, 400);
  }

  // ---------- live feed ----------
  var feedEl = document.getElementById("feed");
  var known = {};
  var firstLoad = true;

  function ago(t) {
    var s = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    return Math.floor(s / 3600) + "h ago";
  }

  function line(tag, text, cls) {
    var el = document.createElement(tag);
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  }

  var lastSig = "";

  function safeImg(u) { return typeof u === "string" && /^https:\/\//i.test(u) ? u : ""; }

  function render(items) {
    if (!items.length) return;
    var sig = items.map(function (it) { return it.jobId + it.t; }).join(",");
    if (sig === lastSig) return;   // nothing new, keep the list as it is
    lastSig = sig;

    feedEl.textContent = "";
    items.forEach(function (it) {
      if (!/^\d{1,20}$/.test(it.placeId) || !/^[0-9a-fA-F-]{36}$/.test(it.jobId)) return;
      var key = it.jobId + it.t;
      var a = document.createElement("a");
      a.className = "item " + String(it.rarity).replace(/[^A-Za-z]/g, "");
      if (!firstLoad && !known[key]) a.className += " new";
      known[key] = true;
      a.href = "?placeId=" + it.placeId + "&jobId=" + it.jobId;
      a.dataset.egg = it.egg;

      var pic = document.createElement("div");
      pic.className = "pic";
      var src = safeImg(it.image);
      if (src) {
        var img = document.createElement("img");
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.onerror = function () { img.remove(); };
        img.src = src;
        pic.appendChild(img);
      }

      var info = document.createElement("div");
      info.className = "info";
      info.appendChild(line("b", it.egg));
      info.appendChild(line("span", "Kg: " + it.kg));
      info.appendChild(line("span", "Mutation: " + (it.mutation && it.mutation !== "NONE" ? it.mutation : "None")));
      info.appendChild(line("span", "Value: " + (it.value || "Unknown")));
      var t = line("span", ago(it.t), "time");
      t.dataset.t = it.t;
      info.appendChild(t);

      a.appendChild(pic);
      a.appendChild(info);
      feedEl.appendChild(a);
    });
    firstLoad = false;
  }

  // ---------- join confirmation ----------
  var dlg = document.getElementById("dlg");
  var pendingHref = "";

  function skipConfirm() {
    try { return localStorage.getItem("skipJoinConfirm") === "1"; } catch (e) { return false; }
  }

  feedEl.addEventListener("click", function (e) {
    var a = e.target.closest("a.item");
    if (!a) return;
    e.preventDefault();
    var href = a.getAttribute("href");
    if (skipConfirm()) { location.href = href; return; }
    pendingHref = href;
    document.getElementById("dlgEgg").textContent = a.dataset.egg || "";
    document.getElementById("never").checked = false;
    dlg.showModal();
  });

  document.getElementById("dlgNo").addEventListener("click", function () { dlg.close(); });
  document.getElementById("dlgYes").addEventListener("click", function () {
    if (document.getElementById("never").checked) {
      try { localStorage.setItem("skipJoinConfirm", "1"); } catch (e) {}
    }
    dlg.close();
    location.href = pendingHref;
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  function poll() {
    if (!FEED_URL) { feedEl.firstChild.textContent = "Feed not set up yet."; return; }
    fetch(FEED_URL, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (Array.isArray(d)) render(d); })
      .catch(function () {});
  }

  setInterval(function () {
    feedEl.querySelectorAll("span[data-t]").forEach(function (s) { s.textContent = ago(+s.dataset.t); });
  }, 1000);

  poll();

  // Check every 2s. A tiny background worker keeps the timer running even when this tab is hidden,
  // because browsers slow down normal timers in background tabs.
  try {
    var ticker = new Worker(URL.createObjectURL(new Blob(
      ["setInterval(function(){postMessage(1)},2000)"], { type: "text/javascript" })));
    ticker.onmessage = poll;
  } catch (e) {
    setInterval(poll, 2000);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
  window.addEventListener("focus", poll);
</script>
</body>
</html>
